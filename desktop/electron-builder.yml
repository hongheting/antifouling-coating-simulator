# Electron Builder — V1 packaging for coating-simulator
# 0.6.0: UI = mobile/www (synced to desktop/ui). Optional signed OTA UI bundles (verified in main).

appId: com.heting.coating-simulator
productName: 防污涂料配方模拟器
copyright: Copyright © 2026 Hong Heting

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - ota-core.js
  - ota-desktop.js
  - package.json

# Ship the static panel next to the binary under resources/ui/
extraResources:
  - from: ui
    to: ui
    filter:
      - "**/*"
      - "!**/node_modules/**"

asar: true

# No electron-updater channel; UI hot-update is the signed-manifest OTA in ota-desktop.js
publish: null

win:
  # Built on Linux with wine (rcedit + NSIS uninstaller). Unsigned build (no code-signing cert).
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  # Unsigned internal builds: users may need right-click → Open

linux:
  target:
    - AppImage
    - deb
  category: Science
  maintainer: Hong Heting <heting@localhost>
  synopsis: Antifouling coating formulation simulator (simulation ≠ measurement)

artifactName: "${productName}-${version}-${arch}-${target}.${ext}"
portable:
  artifactName: "${productName}-${version}-portable-x64.exe"
nsis:
  artifactName: "${productName}-${version}-setup-x64.exe"
  oneClick: false
  allowToChangeInstallationDirectory: true
